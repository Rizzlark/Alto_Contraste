<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nada — Alto_Contraste</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

<main class="container writing">

    <a class="back" href="../index.html">← Alto_Contraste</a>

    <header class="writing-header">

        <h1 class="writing-title">Nada</h1>

    </header>

    <div class="writing-body">

        <p>
            Este texto no significa nada.
        </p>

        <p>
            Está aquí solamente para ocupar un espacio que algún día tendrá otras palabras.
        </p>

        <p>
            Quizás eso también significa algo.
        </p>

    </div>


    <figure class="writing-visual writing-visual-nada">

        <img
            class="writing-image-nada"
            src="../imagenes/nada.png"
            alt=""
        >

    </figure>

</main>


<script>

const nadaImage =
    document.querySelector(".writing-visual-nada");

const imageObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    entry.target.classList.add(
                        "is-visible"
                    );

                    imageObserver.unobserve(
                        entry.target
                    );
                }

            });

        },
        {
            threshold: 0.15
        }
    );

if (nadaImage) {
    imageObserver.observe(nadaImage);
}

</script>

</body>
</html>
