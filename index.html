<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alto en contraste</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f2ed;
            color: #111;
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: min(90%, 760px);
            margin: 0 auto;
            padding: 12vh 0 10vh;
        }

        header {
            margin-bottom: 8rem;
        }

        h1 {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 900;
            line-height: 0.82;
            letter-spacing: -0.07em;
            text-transform: uppercase;
        }

        .contraste {
            display: inline-block;
            margin-top: 0.12em;
            padding: 0.08em 0.12em;
            background: #111;
            color: #f4f2ed;
        }

        .manifiesto {
            max-width: 500px;
            margin-top: 3rem;
            font-size: 1.15rem;
            line-height: 1.7;
            font-style: italic;
        }

        .archivo-titulo {
            margin-bottom: 2rem;
            padding-bottom: 0.7rem;
            border-bottom: 1px solid #111;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        article {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 2rem;
            padding: 2rem 0;
            border-bottom: 1px solid #aaa;
        }

        time {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.75rem;
        }

        article a {
            color: inherit;
            text-decoration: none;
        }

        article h2 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: normal;
        }

        article a:hover h2 {
            font-style: italic;
        }

        .vacio {
            color: #777;
        }

        footer {
            margin-top: 8rem;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            main {
                padding-top: 8vh;
            }

            header {
                margin-bottom: 6rem;
            }

            article {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
        }
    </style>
</head>

<body>

<main>

    <header>
        <h1>
            Alto en<br>
            <span class="contraste">contraste</span>
        </h1>

        <p class="manifiesto">
            Como en mis ilusiones, un lugar que no existe
            en donde estamos Tú y Yo.
        </p>
    </header>


    <section>

        <div class="archivo-titulo">
            Escritos
        </div>

        <!--
        Aquí aparecerán tus textos.

        Cuando escribamos el primero,
        sustituiremos este bloque.
        -->

        <article class="vacio">
            <time>—</time>
            <div>
                <h2>Todavía no hay nada aquí.</h2>
            </div>
        </article>

    </section>


    <footer>
        Alto en contraste
    </footer>

</main>

</body>
</html>
