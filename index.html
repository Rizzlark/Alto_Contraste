    <section>

        <!-- ==================================================

        <article class="entry">

            <span class="entry-code" data-code="001">
                [001]

        <!-- ==================================================

    <footer>
        Alto_Contraste
    </footer>

</main>


<script>

/* ==================================================
   SISTEMA DE CÓDIGOS CORRUPTOS
   ================================================== */

const corruptionSymbols = [
    "_",
    "/",
    "\\",
    "-",
    "."
];

const entries =
    document.querySelectorAll(".entry");


/* ==================================================
   CORROMPER UN CÓDIGO
   ================================================== */

function corruptCode(element) {

    const original =
        element.dataset.code;

    let characters =
        original.split("");

    const position =
        Math.floor(
            Math.random() * characters.length
        );

    const symbol =
        corruptionSymbols[
            Math.floor(
                Math.random() *
                corruptionSymbols.length
            )
        ];

    characters[position] = symbol;

    if (Math.random() < 0.25) {

        const secondPosition =
            Math.floor(
                Math.random() *
                characters.length
            );

        characters[secondPosition] =
            characters[secondPosition] + " ";
    }

    element.textContent =
        "[" + characters.join("") + "]";
}


/* ==================================================
   INICIALIZACIÓN
   ================================================== */

entries.forEach(entry => {

    const code =
        entry.querySelector(".entry-code");

    corruptCode(code);

    entry.addEventListener(
        "mouseenter",
        () => {

            code.textContent =
                "[" +
                code.dataset.code +
                "]";

            code.classList.add(
                "reconstructed"
            );
        }
    );

    entry.addEventListener(
        "mouseleave",
        () => {

            code.classList.remove(
                "reconstructed"
            );

            corruptCode(code);
        }
    );

});


/* ==================================================
   CORRUPCIÓN ESPONTÁNEA
   ================================================== */

setInterval(() => {

    if (entries.length === 0) {
        return;
    }

    const randomEntry =
        entries[
            Math.floor(
                Math.random() *
                entries.length
            )
        ];

    const code =
        randomEntry.querySelector(
            ".entry-code"
        );

    if (!randomEntry.matches(":hover")) {

        corruptCode(code);

        code.classList.add(
            "code-glitch"
        );

        setTimeout(() => {

            code.classList.remove(
                "code-glitch"
            );

        }, 120);

    }

}, 2400);

</script>

</body>

</html>
